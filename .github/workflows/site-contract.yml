name: Site-contract De Schatkamer

# Controleert wekelijks of de website nog levert wat de app verwacht
# (startpagina, zoekdienst, series, programma's, streams, Chromecast-config).
# Ongeveer tien verzoeken per run; maakt een issue aan als er iets is veranderd.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Live contracttests
        run: ./gradlew :core:testDebugUnitTest -Plive --tests '*LiveSiteContractTest*' -Porg.gradle.java.home="$JAVA_HOME"
      - name: Issue bij een fout
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `De Schatkamer-website is veranderd (${new Date().toISOString().slice(0, 10)})`,
              body: `De wekelijkse contracttest faalde: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nDe app gebruikt terugvalroutes, maar controleer de parser.`
            })
