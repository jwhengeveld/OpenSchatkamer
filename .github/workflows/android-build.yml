name: Android CI / Build & Package

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Restore Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Geen signing secrets geconfigureerd; er wordt gebouwd met fallback debug signing."
            exit 0
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/schatkamer-release.jks
          {
            echo "storeFile=keystore/schatkamer-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest testReleaseUnitTest --stacktrace

      - name: Build Release APK and Bundle
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Name Release Artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "schatkamer-androidtv-v${VERSION}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "schatkamer-androidtv-v${VERSION}.aab"
          cp mobile/build/outputs/apk/release/mobile-release.apk "schatkamer-mobile-v${VERSION}.apk"
          cp mobile/build/outputs/bundle/release/mobile-release.aab "schatkamer-mobile-v${VERSION}.aab"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: schatkamer-apps
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            mobile/build/outputs/apk/release/mobile-release.apk
            mobile/build/outputs/bundle/release/mobile-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Publish Release with Artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FILES="schatkamer-androidtv-v${VERSION}.apk schatkamer-androidtv-v${VERSION}.aab schatkamer-mobile-v${VERSION}.apk schatkamer-mobile-v${VERSION}.aab"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $FILES --clobber
          else
            gh release create "$GITHUB_REF_NAME" $FILES \
              --title "De Schatkamer $GITHUB_REF_NAME" \
              --generate-notes
          fi

      - name: Clean Up Signing Key
        if: always()
        run: rm -f keystore/schatkamer-release.jks keystore.properties
